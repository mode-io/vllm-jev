[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-jev"
version = "0.4.0.dev1"
description = "Native vLLM pooling and endpoint integration for Jev candidate scoring"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*.txt"]
dependencies = [
    "transformers>=5.5.4,<6; sys_platform != 'darwin' and sys_platform != 'win32'",
    "transformers>=5.14,<6; sys_platform == 'darwin'",
    "transformers>=5.10.2,<5.18; sys_platform == 'win32'",
    "torch>=2.8,<2.14; sys_platform == 'win32'",
    "accelerate>=1.13,<1.16; sys_platform == 'win32'",
    "numpy>=2.5.4,<2.6; sys_platform == 'win32'",
    "fastapi>=0.115,<1; sys_platform == 'win32'",
    "uvicorn>=0.34,<1; sys_platform == 'win32'",
    "mlx-vlm==0.6.17; sys_platform == 'darwin'",
    "laya==0.3.20",
    "peft>=0.20,<0.21; sys_platform != 'win32'",
    "peft>=0.19.1,<0.22; sys_platform == 'win32'",
    "safetensors",
    "filelock",
    "huggingface_hub>=0.34,<2",
]

[project.optional-dependencies]
# Use separate environments. The Windows profiles have incompatible exact pins.
# The base ranges let each exact profile resolve without overriding metadata.
windows-legacy = [
    "torch==2.8.0; sys_platform == 'win32'",
    "transformers==5.10.2; sys_platform == 'win32'",
    "peft==0.19.1; sys_platform == 'win32'",
    "accelerate==1.13.0; sys_platform == 'win32'",
    "numpy==2.5.4; sys_platform == 'win32'",
]
windows-modern = [
    "torch==2.8.0; sys_platform == 'win32'",
    "transformers==5.17.0; sys_platform == 'win32'",
    "peft==0.21.0; sys_platform == 'win32'",
    "accelerate==1.15.0; sys_platform == 'win32'",
    "numpy==2.5.4; sys_platform == 'win32'",
    # Direct dependencies of the tokenizer-only Mica GGUF profile.
    "tokenizers==0.23.3; sys_platform == 'win32'",
    "jinja2==3.1.6; sys_platform == 'win32'",
]
windows-bruv = [
    "torch==2.9.1; sys_platform == 'win32'",
    "transformers==5.17.0; sys_platform == 'win32'",
    "peft==0.21.0; sys_platform == 'win32'",
    "accelerate==1.15.0; sys_platform == 'win32'",
    "numpy==2.5.4; sys_platform == 'win32'",
    "tokenizers==0.23.3; sys_platform == 'win32'",
    "jinja2==3.1.6; sys_platform == 'win32'",
]
windows-rsi = [
    "torch==2.13.0; sys_platform == 'win32'",
    "transformers==5.17.0; sys_platform == 'win32'",
    "peft==0.21.0; sys_platform == 'win32'",
    "accelerate==1.15.0; sys_platform == 'win32'",
    "numpy==2.5.4; sys_platform == 'win32'",
    "tokenizers==0.23.3; sys_platform == 'win32'",
    "jinja2==3.1.6; sys_platform == 'win32'",
]
cuda = ["vllm==0.29.0", "transformers>=5.10,<5.11"]
# Install vLLM/torch-npu from the matched Ascend runtime image first; a generic
# PyPI vLLM wheel can carry CUDA libraries and must not replace that runtime.

[project.scripts]
vllm-jev = "vllm_jev.cli:main"
vllm-jev-radixflow = "vllm_jev.radixflow.launch:main"

[project.entry-points."vllm.general_plugins"]
vllm_jev_model = "vllm_jev:register"

[project.entry-points."vllm.endpoint_plugins"]
vllm_jev_endpoint = "vllm_jev.endpoint:JevEndpointPlugin"

[tool.setuptools.packages.find]
include = ["vllm_jev*"]

[tool.setuptools.package-data]
"vllm_jev._vendor.mica" = ["codebook_255.json", "LICENSE", "NOTICE"]

[tool.ruff]
line-length = 88
# Preserve the attributed upstream implementation byte-for-byte.
extend-exclude = ["vllm_jev/_vendor/mica"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
