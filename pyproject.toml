[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-jev"
version = "0.3.1"
description = "Native vLLM pooling and endpoint integration for Jev candidate scoring"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*.txt"]
dependencies = [
    "vllm==0.29.0",
    "transformers>=5.10,<5.11; sys_platform != 'darwin'",
    "transformers>=5.14,<6; sys_platform == 'darwin'",
    "mlx-vlm==0.6.17; sys_platform == 'darwin'",
    "laya==0.3.20",
    "peft>=0.20,<0.21",
    "safetensors",
    "filelock",
    "huggingface_hub>=0.34,<2",
]

[project.scripts]
vllm-jev = "vllm_jev.cli:main"

[project.entry-points."vllm.general_plugins"]
vllm_jev_model = "vllm_jev:register"

[project.entry-points."vllm.endpoint_plugins"]
vllm_jev_endpoint = "vllm_jev.endpoint:JevEndpointPlugin"

[tool.setuptools.packages.find]
include = ["vllm_jev*"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
